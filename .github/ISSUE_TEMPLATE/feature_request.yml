name: LibreWinForms API or feature request
description: Request a missing WinForms API, portable behavior, or LibreWinForms improvement.
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing LibreWinForms issues](https://github.com/wieslawsoltes/LibreWinForms/issues) first.
        LibreWinForms reuses the existing WinForms API surface. For a compatibility gap, identify the original API and expected behavior rather than designing a replacement API.
  - type: textarea
    id: background
    attributes:
      label: Background and motivation
      description: Describe the application or workflow this enables and the affected platforms (Windows, macOS, or Linux).
    validations:
      required: true
  - type: textarea
    id: requested-behavior
    attributes:
      label: Requested API or behavior
      description: |
        For a missing API, include its fully qualified type/member, signature or documentation link, and expected behavior.
        For other improvements, describe the desired result. Include your LibreWinForms package version or source commit if you tested current behavior.
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Usage example
      description: Provide a small code example or concrete workflow showing how the API or feature would be used.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any workarounds you tried and their limitations.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and UI impact
      description: Note any known compatibility, performance, accessibility, localization, or tooling implications.
    validations:
      required: false
