name: LibreWinForms bug report
description: Report a LibreWinForms build, runtime, rendering, or compatibility problem.
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing LibreWinForms issues](https://github.com/wieslawsoltes/LibreWinForms/issues) before reporting a problem.
        Reports from Windows, macOS, and Linux are welcome. Include a small reproduction and remove secrets or personal information from logs.
  - type: textarea
    id: versions
    attributes:
      label: LibreWinForms and .NET versions
      description: Include the LibreWinForms.Sdk and package versions (or source commit), target framework, and `dotnet --info` output. For mixed WPF/WinForms apps, include LibreWPF and ProGPU versions too.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Platform and environment
      description: Include OS and version, CPU architecture or RID, and whether this is a physical machine, VM, or CI runner. For rendering issues, include GPU/driver and display scale; on Linux, include the display server/session. Include IDE/version for tooling issues and language/culture for localization issues.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and affected controls or APIs. Attach screenshots or recordings if they help show the difference.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and minimal reproduction
      description: |
        Include a small sample or repository link, relevant project/global.json settings, and exact build/run commands.
        For test failures, include the fully qualified test name, configuration, and CI run link when available.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression or comparison
      description: Did this work in an earlier LibreWinForms version or on another platform? If available, include behavior with Microsoft WinForms on Windows. This comparison is optional; Windows access is not required to report a problem.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostics
      description: Paste relevant build output, the complete exception and stack trace, or test output. Attach larger logs after removing secrets or personal information.
      render: text
    validations:
      required: false
