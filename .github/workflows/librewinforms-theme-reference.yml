name: Independent Windows text raster reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    name: Original GDI and GDI+ text without input
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/TextRasterReference
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Compile isolated original Microsoft reference
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'text-raster-source'
          Copy-Item eng/TextRasterReference $source -Recurse
          Set-Content (Join-Path $source 'global.json') '{"sdk":{"version":"10.0.201","rollForward":"disable"}}'
          Push-Location $source
          dotnet build TextRasterReference.csproj -c Release --nologo -r win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Observe complete bounded raster inventory
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'text-raster-source'
          $evidence = Join-Path $env:RUNNER_TEMP 'text-raster-evidence'
          $app = Join-Path $source 'bin/Release/net10.0-windows/win-arm64/TextRasterReference.exe'
          $out = Join-Path $env:RUNNER_TEMP 'text-raster-stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'text-raster-stderr.log'
          $child = Start-Process -FilePath $app -ArgumentList @('"' + $evidence + '"') -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $child.WaitForExit(60000)) {
            $child.Kill($true)
            $child.WaitForExit()
            throw 'Original text reference exceeded 60 seconds.'
          }
          $child.Refresh()
          if ($child.ExitCode -ne 0) { throw "Original text reference exited $($child.ExitCode)." }
          Get-ChildItem $source -Recurse -File | Where-Object { $_.Extension -in '.cs', '.csproj', '.props', '.targets', '.config', '.exe', '.dll', '.json' } | Get-FileHash -Algorithm SHA256 | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $evidence 'source-and-payload-hashes.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-text-raster-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/text-raster-evidence/**
            ${{ runner.temp }}/text-raster-stdout.log
            ${{ runner.temp }}/text-raster-stderr.log
            ${{ runner.temp }}/text-raster-source/Program.cs
            ${{ runner.temp }}/text-raster-source/TextRasterReference.csproj
