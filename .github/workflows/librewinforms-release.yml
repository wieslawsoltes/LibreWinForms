name: LibreWinForms Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to build.
        required: true
        default: 0.1.0-preview.70
      source_tag:
        description: Existing immutable librewinforms-v tag to rebuild with this workflow. Empty uses the workflow ref.
        required: false
        default: ''
      bridge_version:
        description: LibreWPF bridge package version to build against. Defaults to version.
        required: false
        default: ''
      progpu_version:
        description: Version assigned to the ProGPU drawing closure built from the pinned submodule. Defaults to version.
        required: false
        default: ''
      bridge_ref:
        description: Immutable LibreWPF tag or commit supplying the LibreWPF SDK package smoke. Defaults to librewpf-v<bridge_version>.
        required: false
        default: ''
      canonical_wfi_ref:
        description: Immutable LibreWPF commit or tag containing the canonical WindowsFormsIntegration source gate.
        required: false
        default: ''
      publish:
        description: Push packages to NuGet.org after validation.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - librewinforms-v*

permissions:
  actions: read
  contents: write

jobs:
  preview:
    name: Build preview packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LIBREWINFORMS_NATIVE_STAGING_WPF_COMMIT: 065e8cc0c027566f1316169063ba92f14fa715fb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag || github.ref }}
          submodules: recursive

      - name: Resolve release version
        id: release
        shell: bash
        env:
          REQUESTED_SOURCE_TAG: ${{ inputs.source_tag }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_tag="${REQUESTED_SOURCE_TAG}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${release_tag}" ]]; then
            if [[ ! "${release_tag}" =~ ^librewinforms-v[0-9][0-9A-Za-z.+-]*$ ]]; then
              echo "Release source must be an existing librewinforms-v version tag." >&2
              exit 1
            fi
            git show-ref --verify "refs/tags/${release_tag}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            version="${release_tag#librewinforms-v}"
            if [[ -n "${REQUESTED_VERSION}" && "${REQUESTED_VERSION}" != "${version}" ]]; then
              echo "Requested version must match the immutable source tag." >&2
              exit 1
            fi
          else
            version="${REQUESTED_VERSION}"
          fi
          bridge_version="${{ inputs.bridge_version }}"
          if [[ -z "${bridge_version}" ]]; then
            bridge_version="${version}"
          fi
          progpu_version="${{ inputs.progpu_version }}"
          if [[ -z "${progpu_version}" ]]; then
            progpu_version="${version}"
          fi
          bridge_ref="${{ inputs.bridge_ref }}"
          if [[ -z "${bridge_ref}" ]]; then
            bridge_ref="librewpf-v${bridge_version}"
          fi
          canonical_wfi_ref="${{ inputs.canonical_wfi_ref }}"
          if [[ -z "${canonical_wfi_ref}" ]]; then
            canonical_wfi_ref="librewpf-v${bridge_version}"
          fi
          echo "LIBREWINFORMS_DEV_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "LIBREWINFORMS_BRIDGE_PACKAGE_VERSION=${bridge_version}" >> "${GITHUB_ENV}"
          echo "LIBREWINFORMS_PROGPU_PACKAGE_VERSION=${progpu_version}" >> "${GITHUB_ENV}"
          echo "LIBREWINFORMS_BRIDGE_REF=${bridge_ref}" >> "${GITHUB_ENV}"
          echo "LIBREWINFORMS_CANONICAL_WFI_REF=${canonical_wfi_ref}" >> "${GITHUB_ENV}"
          echo "bridge_ref=${bridge_ref}" >> "${GITHUB_OUTPUT}"
          echo "canonical_wfi_ref=${canonical_wfi_ref}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved LibreWinForms package version: ${version}"
          echo "Resolved LibreWPF bridge package version: ${bridge_version}"
          echo "Resolved immutable ProGPU package version: ${progpu_version}"
          echo "Resolved immutable LibreWPF bridge ref: ${bridge_ref}"
          echo "Resolved canonical LibreWPF WFI ref: ${canonical_wfi_ref}"

      - name: Checkout LibreWPF bridge packages
        uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/wpf
          ref: ${{ steps.release.outputs.bridge_ref }}
          path: artifacts/checkouts/wpf-bridge
          submodules: recursive

      - name: Checkout canonical LibreWPF WFI source
        uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/LibreWPF
          ref: ${{ steps.release.outputs.canonical_wfi_ref }}
          path: artifacts/checkouts/wpf-canonical

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux display for SDK initialization
        shell: bash
        run: |
          ./external/ProGPU/eng/progpu-install-linux-packages.sh \
            xvfb \
            libglfw3 \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Align canonical LibreWPF ProGPU checkout
        shell: bash
        run: |
          set -euo pipefail
          qualified_progpu_commit="$(git -C external/ProGPU rev-parse HEAD)"
          git -C artifacts/checkouts/wpf-canonical submodule update --init external/ProGPU
          git -C artifacts/checkouts/wpf-canonical/external/ProGPU fetch --depth=1 origin "${qualified_progpu_commit}"
          git -C artifacts/checkouts/wpf-canonical/external/ProGPU checkout --detach "${qualified_progpu_commit}"
          test "$(git -C artifacts/checkouts/wpf-canonical/external/ProGPU rev-parse HEAD)" = "$(git -C external/ProGPU rev-parse HEAD)"

      - name: Checkout immutable LibreWPF native staging helper
        uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/LibreWPF
          ref: ${{ env.LIBREWINFORMS_NATIVE_STAGING_WPF_COMMIT }}
          path: artifacts/checkouts/wpf-native-staging
          sparse-checkout: |
            eng/progpu-stage-ci-native-runtimes.sh
            eng/progpu-stage-release-native-packages.py
          sparse-checkout-cone-mode: false

      - name: Stage exact successful ProGPU native runtimes for canonical packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qualified_progpu_commit="$(git -C external/ProGPU rev-parse HEAD)"
          test "$(git -C artifacts/checkouts/wpf-native-staging rev-parse HEAD)" = "${LIBREWINFORMS_NATIVE_STAGING_WPF_COMMIT}"
          ./artifacts/checkouts/wpf-native-staging/eng/progpu-stage-ci-native-runtimes.sh \
            "${qualified_progpu_commit}" \
            "${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-native/package" \
            "${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-dx12/package" \
            "${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-xlib/package" \
            "${GITHUB_WORKSPACE}/external/ProGPU/artifacts/progpu-wgpu-windows/package" \
            "${GITHUB_WORKSPACE}/external/ProGPU"

      - name: Verify docs
        run: ./eng/librewinforms-verify-docs.sh

      - name: Build canonical WindowsFormsIntegration from LibreWPF source
        shell: bash
        run: |
          set -euo pipefail
          canonical_wfi_commit="$(git -C artifacts/checkouts/wpf-canonical rev-parse HEAD)"
          LIBREWINFORMS_CANONICAL_WFI_SOURCE_ROOT="${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-canonical" \
          LIBREWINFORMS_CANONICAL_WFI_EXPECTED_COMMIT="${canonical_wfi_commit}" \
          LIBREWINFORMS_CANONICAL_WFI_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-canonical/artifacts/packages/CanonicalWinForms" \
          xvfb-run -a ./eng/librewinforms-build-canonical-wfi.sh
          echo "LIBREWINFORMS_CANONICAL_WFI_COMMIT=${canonical_wfi_commit}" >> "${GITHUB_ENV}"
          echo "LIBREWINFORMS_CANONICAL_WFI_PACKAGE_SOURCE=${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-canonical/artifacts/packages/CanonicalWinForms" >> "${GITHUB_ENV}"

      - name: Stage immutable LibreWPF bridge packages
        shell: bash
        run: |
          set -euo pipefail
          LIBREWINFORMS_BRIDGE_CHECKOUT="${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-bridge" \
          LIBREWINFORMS_BRIDGE_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-bridge/artifacts/packages/Release/NonShipping" \
          ./eng/librewinforms-fetch-librewpf-packages.sh

      - name: Build and pack
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_PROGPU_COMMIT="$(git -C external/ProGPU rev-parse HEAD)"
          export LIBREWINFORMS_REQUIRE_CLEAN=1
          xvfb-run -a ./eng/librewinforms-pack.sh

      - name: Run package-mode SDK smoke
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_BRIDGE_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/artifacts/checkouts/wpf-bridge/artifacts/packages/Release/NonShipping"
          xvfb-run -a ./eng/librewinforms-package-smoke.sh

      - name: Validate complete NuGet upload size inventory
        run: python3 external/ProGPU/eng/progpu-verify-package-sizes.py artifacts/packages/Release/NonShipping

      - name: Verify complete source and recovery workflow Build qualification
        if: ${{ inputs.source_tag != '' }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          import json, os, pathlib, subprocess, time

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          repository = os.environ["GITHUB_REPOSITORY"]
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          required = set((source, os.environ["WORKFLOW_COMMIT"]))
          qualified = {}
          deadline = time.monotonic() + 3600
          while required - qualified.keys():
              for commit in sorted(required - qualified.keys()):
                  runs = api(f"repos/{repository}/actions/runs?head_sha={commit}&status=success&per_page=100")
                  for run in runs["workflow_runs"]:
                      if (run["path"] != ".github/workflows/librewinforms-ci.yml"
                              or run["head_sha"] != commit or run["conclusion"] != "success"):
                          continue
                      jobs = api(f"repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100")
                      if (jobs["total_count"] == len(jobs["jobs"]) == 9
                              and all(job["conclusion"] == "success" for job in jobs["jobs"])):
                          qualified[commit] = {"run": run, "jobs": jobs}
                          print(f"Qualified all nine Build jobs: {commit}, run {run['id']}", flush=True)
                          break
              if required - qualified.keys():
                  if time.monotonic() >= deadline:
                      raise SystemExit("Source or recovery workflow lacks a whole successful nine-job Build.")
                  time.sleep(30)
          receipt = pathlib.Path("artifacts/packages/Release/NonShipping/librewinforms-release-qualification.json")
          receipt.write_text(json.dumps({"sourceCommit": source,
                                        "workflowCommit": os.environ["WORKFLOW_COMMIT"],
                                        "qualified": qualified}, indent=2) + "\n")

      - name: Upload preview packages
        uses: actions/upload-artifact@v4
        with:
          name: librewinforms-packages-${{ env.LIBREWINFORMS_DEV_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/librewinforms-v') }}
        run: dotnet nuget push artifacts/packages/Release/NonShipping/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: ${{ steps.release.outputs.tag != '' && (inputs.publish || startsWith(github.ref, 'refs/tags/librewinforms-v')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/packages/Release/NonShipping/*.nupkg \
            artifacts/packages/Release/NonShipping/*.json \
            artifacts/packages/Release/NonShipping/*.tar.gz \
            artifacts/packages/Release/NonShipping/*.sha256 \
            artifacts/packages/Release/NonShipping/README.md \
            artifacts/packages/Release/NonShipping/NuGet.config \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LibreWinForms ${{ env.LIBREWINFORMS_DEV_PACKAGE_VERSION }}" \
            --generate-notes \
            --verify-tag \
            --prerelease
