name: DIAGNOSTIC ONLY original grid-fit phase
on:
  pull_request:
    branches: [fix/portable-scrollbar-pointer]
    paths: [eng/GridFitPhaseReference/**, .github/workflows/diagnostic-gridfit-phase.yml]
permissions:
  contents: read
jobs:
  placement:
    name: Original GDI+ grid-fit phase without input
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: eng/GridFitPhaseReference
      - name: Bootstrap isolated SDK and observe original readback
        shell: python {0}
        run: |
          import runpy
          runpy.run_path("eng/GridFitPhaseReference/run.py", run_name="__main__")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-gridfit-phase-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/original-gridfit-phase/*.cs
            ${{ runner.temp }}/original-gridfit-phase/*.py
            ${{ runner.temp }}/original-gridfit-phase/*.csproj
            ${{ runner.temp }}/original-gridfit-phase/*.json
            ${{ runner.temp }}/original-gridfit-phase/*.log
            ${{ runner.temp }}/original-gridfit-phase/evidence/**
