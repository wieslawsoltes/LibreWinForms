name: LibreWinForms Docs

on:
  pull_request:
    branches:
      - librewinforms-progpu-port
    paths:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - eng/librewinforms-*.sh
      - .github/workflows/librewinforms-*.yml
  push:
    branches:
      - librewinforms-progpu-port
    paths:
      - README.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - eng/librewinforms-*.sh
      - .github/workflows/librewinforms-*.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBREWINFORMS_QUALIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-docs:
    name: Verify release documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIBREWINFORMS_QUALIFIED_COMMIT }}

      - name: Verify exact producer source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${LIBREWINFORMS_QUALIFIED_COMMIT}"

      - name: Verify package docs
        run: ./eng/librewinforms-verify-docs.sh

      - name: Upload docs snapshot
        uses: actions/upload-artifact@v4
        with:
          name: librewinforms-docs
          include-hidden-files: true
          path: |
            README.md
            docs/**
            .github/ISSUE_TEMPLATE/**
