name: Original GDI grid raster observation
on:
  pull_request:
    branches: [fix/portable-scrollbar-pointer]
    paths: ['eng/OriginalGdiGrid/**', '.github/workflows/original-gdi-grid.yml']
permissions:
  contents: read
jobs:
  original:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: eng/OriginalGdiGrid/global.json
      - name: Original Microsoft only, no input or windows
        shell: pwsh
        env:
          GDI_REFERENCE_EVIDENCE: ${{ github.workspace }}/artifacts/original-gdi-grid
        run: |
          python eng/OriginalGdiGrid/run.py
          if ($LASTEXITCODE -ne 0) { throw 'Original GDI observation failed; preserve outcome without retry.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-gdi-grid
          path: |
            artifacts/original-gdi-grid
            eng/OriginalGdiGrid
          if-no-files-found: error
