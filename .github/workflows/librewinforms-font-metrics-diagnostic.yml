name: DIAGNOSTIC ONLY Windows font autoscale metrics
on:
  workflow_dispatch:
  push:
    branches: [fix-hosted-original-grid]
    paths:
      - .github/workflows/librewinforms-font-metrics-diagnostic.yml
      - eng/OriginalGrid/FontMetricsDiagnostic.cs
permissions:
  contents: read
jobs:
  metrics:
    name: Read original GDI metrics without creating application windows
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.5.26302.115
      - name: Build and run bounded read-only native metric probe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'original-font-metrics'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          Copy-Item eng/OriginalGrid/FontMetricsDiagnostic.cs $root
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net11.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup></Project>' | Set-Content "$root/Probe.csproj"
          '{"sdk":{"version":"11.0.100-preview.5.26302.115","rollForward":"disable"}}' | Set-Content "$root/global.json"
          Push-Location $root
          try {
            dotnet build Probe.csproj -c Release -m:1 -p:UseSharedCompilation=false *> build.log
            if ($LASTEXITCODE -ne 0) { throw 'Native metric probe did not compile.' }
            $process = Start-Process dotnet -ArgumentList @('bin/Release/net11.0/Probe.dll') -PassThru -NoNewWindow -RedirectStandardOutput metrics.json -RedirectStandardError stderr.log
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Original 30-second diagnostic limit exceeded.' }
            if ($process.ExitCode -ne 0) { throw 'Native metric diagnostic failed.' }
            $result = Get-Content metrics.json -Raw | ConvertFrom-Json
            if ($result.cases.Count -ne 45 -or $result.qualified -or -not $result.diagnosticOnly) { throw 'Unexpected original case inventory.' }
            Get-FileHash FontMetricsDiagnostic.cs, metrics.json -Algorithm SHA256 | ConvertTo-Json | Set-Content hashes.json
          } finally { Pop-Location }
      - name: Retain original metrics and build failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-native-font-metrics
          retention-days: 14
          path: |
            ${{ runner.temp }}/original-font-metrics/*.cs
            ${{ runner.temp }}/original-font-metrics/*.csproj
            ${{ runner.temp }}/original-font-metrics/*.json
            ${{ runner.temp }}/original-font-metrics/*.log
