name: DIAGNOSTIC ONLY paired native font outlines
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference:
    name: Original GDI and exact native package font outlines
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/OriginalFontOutlines
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Compare original and native font outlines without input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/OriginalFontOutlines/run_pair.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-font-outlines-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/font-outline-pair/original/**
            ${{ runner.temp }}/font-outline-pair/*.log
            ${{ runner.temp }}/font-outline-pair/payload-hashes.json
            ${{ runner.temp }}/font-outline-pair/native/**
            ${{ runner.temp }}/font-outline-pair/producer.json
            eng/OriginalFontOutlines/**
