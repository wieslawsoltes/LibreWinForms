name: DIAGNOSTIC ONLY original text contrast and color
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrast:
    name: Original GDI+ contrast and alpha without input
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/TextContrastReference
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Build and observe original contrast in a bounded process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or -not $IsWindows) {
            throw 'Disposable hosted Windows required.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'original-text-contrast'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          Copy-Item eng/TextContrastReference/*.cs, eng/TextContrastReference/*.csproj, eng/TextContrastReference/global.json $root
          Push-Location $root
          try {
            dotnet build TextContrastReference.csproj -c Release -r win-arm64 --nologo *> build.log
            if ($LASTEXITCODE -ne 0) { throw 'Original reference did not compile.' }
            $output = Join-Path $root 'evidence'
            $child = Start-Process 'bin/Release/net10.0-windows/win-arm64/TextContrastReference.exe' `
              -ArgumentList @('"' + $output + '"') -NoNewWindow -PassThru `
              -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
            if (-not $child.WaitForExit(60000)) {
              $child.Kill($true); $child.WaitForExit()
              throw 'Original 60-second controller deadline exceeded.'
            }
            $child.Refresh()
            if ($child.ExitCode -ne 0) { throw "Original contrast reference exited $($child.ExitCode)." }
            $result = Get-Content evidence/reference.json -Raw | ConvertFrom-Json
            if ($result.cases.Count -ne 936 -or $result.qualified -or $result.inputEvents -ne 0 -or
                $result.desktopWindows -ne 0 -or $result.elapsedSeconds -gt 45) {
              throw 'Incomplete original bounded no-input inventory.'
            }
            Get-FileHash Program.cs, TextContrastReference.csproj, global.json, evidence/reference.json -Algorithm SHA256 |
              ConvertTo-Json | Set-Content source-hashes.json
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-text-contrast-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/original-text-contrast/*.cs
            ${{ runner.temp }}/original-text-contrast/*.csproj
            ${{ runner.temp }}/original-text-contrast/*.json
            ${{ runner.temp }}/original-text-contrast/*.log
            ${{ runner.temp }}/original-text-contrast/evidence/**
