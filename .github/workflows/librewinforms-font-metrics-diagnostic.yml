name: DIAGNOSTIC ONLY original GDI outline observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    name: Original GDI outlines and unchanged 72 raster frames
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/OriginalFontOutlines
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Capture original font outlines without input
        shell: pwsh
        run: ./eng/OriginalFontOutlines/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-font-outlines-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/font-outline-original/original/**
            ${{ runner.temp }}/font-outline-original/*.log
            ${{ runner.temp }}/font-outline-original/payload-hashes.json
            eng/OriginalFontOutlines/**
