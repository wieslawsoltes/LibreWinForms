name: DIAGNOSTIC ONLY paired text raster observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pair:
    name: Original and portable package text without input
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/TextRasterPair
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Build and observe exact original and qualified package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/TextRasterPair/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-text-raster-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/text-pair/original/**
            ${{ runner.temp }}/text-pair/portable/**
            ${{ runner.temp }}/text-pair/*.log
            ${{ runner.temp }}/text-pair/payload-hashes.json
            ${{ runner.temp }}/text-pair/producer.json
            eng/TextRasterPair/reference/Program.cs
            eng/TextRasterPair/reference/TextRasterReference.csproj
            eng/TextRasterPair/portable/Program.cs
            eng/TextRasterPair/portable/PortableTextRaster.csproj
            eng/TextRasterPair/run.ps1
