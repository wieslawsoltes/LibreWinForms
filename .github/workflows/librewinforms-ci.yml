name: Portable scrollbar read-only package observation
on:
  workflow_dispatch:
    inputs:
      producer_pin:
        description: Exact successful producer with complete artifact and package hashes
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.201
            11.0.100-preview.5.26302.115
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prepared guards without input
        shell: pwsh
        run: |
          Push-Location eng/PortableScrollBarRepeat
          python -B -m unittest test_geometry test_reference_driver test_startup test_portable_driver -v
          if ($LASTEXITCODE -ne 0) { throw 'Prepared offline guards failed.' }
          Pop-Location
          python -B eng/tests/test_original_grid_hosted_preparation.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole producer guards failed.' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(inputs.producer_pin).build }}
          name: canonical-source-first-package
          path: ${{ runner.temp }}/repeat-feed
      - name: Build observer from the exact whole-qualified package closure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_PIN: ${{ inputs.producer_pin }}
        run: |
          Set-Content "$env:RUNNER_TEMP/repeat-producer.json" $env:PRODUCER_PIN
          python -B eng/PortableScrollBarRepeat/prepare-package.py `
            --repository . --source eng/PortableScrollBarRepeat/source `
            --feed "$env:RUNNER_TEMP/repeat-feed" --producer-pin "$env:RUNNER_TEMP/repeat-producer.json" `
            --output "$env:RUNNER_TEMP/repeat-application"
          if ($LASTEXITCODE -ne 0) { throw 'Prepared package application did not qualify for observation.' }
      - name: Read original owned-window and actual paint geometry without input
        shell: pwsh
        run: |
          $receipt = Get-Content "$env:RUNNER_TEMP/repeat-application/preparation-receipt.json" -Raw | ConvertFrom-Json
          python -B eng/PortableScrollBarRepeat/portable_driver.py `
            --app $receipt.app --helper eng/librewinforms-popup-desktop.py `
            --evidence "$env:RUNNER_TEMP/repeat-observation" --observe-startup-only --diagnose-startup
          if ($LASTEXITCODE -ne 0) { throw 'Read-only package observation failed; original evidence retained.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-repeat-read-only-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/repeat-application/preparation-receipt.json
            ${{ runner.temp }}/repeat-producer.json
            ${{ runner.temp }}/repeat-observation/**
            eng/PortableScrollBarRepeat/*.py
            eng/PortableScrollBarRepeat/source/*.cs
            eng/PortableScrollBarRepeat/source/Portable.csproj
