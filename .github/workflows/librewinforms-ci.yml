name: LibreWinForms Build

on:
  pull_request:
    branches:
      - librewinforms-progpu-port
      - main
  push:
    branches:
      - librewinforms-progpu-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-first-shadow:
    name: Canonical source and ProGPU submodule lane
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install software WebGPU adapter
        shell: bash
        run: |
          ./external/ProGPU/eng/progpu-install-linux-packages.sh \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Setup .NET 10 for ProGPU
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup LibreWinForms repository SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate canonical source and local ProGPU graph
        shell: bash
        run: ./eng/librewinforms-source-first.sh

      - name: Pack and consume canonical source-first package
        shell: bash
        run: ./eng/librewinforms-pack-source-first.sh

      - name: Upload canonical source-first package
        uses: actions/upload-artifact@v4
        with:
          name: canonical-source-first-package
          path: artifacts/packages/source-first/*.nupkg
          if-no-files-found: error

  source-first-visible:
    name: Visible canonical package (${{ matrix.os }})
    needs: source-first-shadow
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux display and software WebGPU adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libglfw3 libvulkan1 mesa-vulkan-drivers

      - name: Setup .NET 10 for ProGPU dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup LibreWinForms repository SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download canonical package closure
        uses: actions/download-artifact@v4
        with:
          name: canonical-source-first-package
          path: artifacts/packages/source-first

      - name: Run visible installed-SDK package smoke
        shell: bash
        env:
          LIBREWINFORMS_VISIBLE_DOTNET: dotnet
        run: ./eng/librewinforms-source-first-visible-smoke.sh

  appkit-adapter:
    name: AppKit adapter lane
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10 for ProGPU
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup LibreWinForms repository SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test typed AppKit file-dialog adapter
        shell: bash
        run: |
          dotnet run \
            --project src/LibreWinForms.ProGPU/tests/LibreWinForms.ProGPU.Tests.csproj \
            --configuration Release \
            -- \
            --minimum-expected-tests 6 \
            --filter-class '*MacOsAppKitFileDialogTests*'

  packages:
    name: Package lane
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LIBREWINFORMS_DEV_PACKAGE_VERSION: 0.1.0-preview.45
      LIBREWINFORMS_BRIDGE_PACKAGE_VERSION: 0.1.0-preview.45
      LIBREWINFORMS_PROGPU_PACKAGE_VERSION: 0.1.0-preview.55
      LIBREWINFORMS_BRIDGE_REF: librewpf-v0.1.0-preview.45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout LibreWPF bridge packages
        uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/wpf
          ref: ${{ env.LIBREWINFORMS_BRIDGE_REF }}
          path: wpf-bridge
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Stage immutable LibreWPF bridge packages
        shell: bash
        run: |
          set -euo pipefail
          LIBREWINFORMS_BRIDGE_CHECKOUT="${GITHUB_WORKSPACE}/wpf-bridge" \
          LIBREWINFORMS_BRIDGE_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping" \
          ./eng/librewinforms-fetch-librewpf-packages.sh

      - name: Run LibreWinForms behavior tests
        shell: bash
        run: |
          set -euo pipefail
          restore_sources="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping;https://api.nuget.org/v3/index.json"
          dotnet run \
            --project src/test/compatibility/LibreWinForms.Portable.Tests/LibreWinForms.Portable.Tests.csproj \
            --configuration Release \
            -p:LibreWinFormsReferenceMode=Package \
            -p:LibreWinFormsBridgePackageVersion="${LIBREWINFORMS_BRIDGE_PACKAGE_VERSION}" \
            -p:LibreWinFormsProGpuPackageVersion="${LIBREWINFORMS_PROGPU_PACKAGE_VERSION}" \
            -p:RestoreSources="${restore_sources}"

      - name: Pack LibreWinForms
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_RESTORE_SOURCES="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping;https://api.nuget.org/v3/index.json"
          export LIBREWINFORMS_STRONG_NAME_KEY_FILE="${GITHUB_WORKSPACE}/wpf-bridge/external/ProGPU/eng/ProGPU.snk"
          export LIBREWINFORMS_BRIDGE_COMMIT="$(git -C wpf-bridge rev-parse HEAD)"
          export LIBREWINFORMS_PROGPU_COMMIT="$(git -C wpf-bridge/external/ProGPU rev-parse HEAD)"
          export LIBREWINFORMS_REQUIRE_CLEAN=1
          ./eng/librewinforms-pack.sh

      - name: Run package-mode SDK smoke
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_BRIDGE_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping"
          ./eng/librewinforms-package-smoke.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: librewinforms-ci-packages-${{ github.sha }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error
