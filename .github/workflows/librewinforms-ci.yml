name: LibreWinForms Build

on:
  pull_request:
    branches:
      - librewinforms-progpu-port
      - main
  push:
    branches:
      - librewinforms-progpu-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Package lane
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LIBREWINFORMS_DEV_PACKAGE_VERSION: 0.1.0-preview.10
      LIBREWINFORMS_BRIDGE_PACKAGE_VERSION: 0.1.0-preview.10
      LIBREWINFORMS_BRIDGE_REF: progpu-rendering-port

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout LibreWPF bridge packages
        uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/wpf
          ref: ${{ env.LIBREWINFORMS_BRIDGE_REF }}
          path: wpf-bridge
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build LibreWPF bridge packages
        shell: bash
        run: |
          set -euo pipefail
          cd wpf-bridge
          PROGPU_WPF_DEV_PACKAGE_VERSION="${LIBREWINFORMS_BRIDGE_PACKAGE_VERSION}" ./eng/progpu-wpf-sdk-ci.sh

      - name: Run LibreWinForms behavior tests
        shell: bash
        run: |
          set -euo pipefail
          restore_sources="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping;https://api.nuget.org/v3/index.json"
          dotnet run \
            --project src/LibreWinForms.Portable/LibreWinForms.System.Windows.Forms.Tests/LibreWinForms.System.Windows.Forms.Tests.csproj \
            --configuration Release \
            -p:LibreWinFormsReferenceMode=Package \
            -p:LibreWinFormsBridgePackageVersion="${LIBREWINFORMS_BRIDGE_PACKAGE_VERSION}" \
            -p:RestoreSources="${restore_sources}"

      - name: Pack LibreWinForms
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_RESTORE_SOURCES="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping;https://api.nuget.org/v3/index.json"
          export LIBREWINFORMS_STRONG_NAME_KEY_FILE="${GITHUB_WORKSPACE}/wpf-bridge/external/ProGPU/eng/ProGPU.snk"
          export LIBREWINFORMS_BRIDGE_COMMIT="$(git -C wpf-bridge rev-parse HEAD)"
          export LIBREWINFORMS_PROGPU_COMMIT="$(git -C wpf-bridge/external/ProGPU rev-parse HEAD)"
          export LIBREWINFORMS_REQUIRE_CLEAN=1
          ./eng/librewinforms-pack.sh

      - name: Run package-mode SDK smoke
        shell: bash
        run: |
          set -euo pipefail
          export LIBREWINFORMS_BRIDGE_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/wpf-bridge/artifacts/packages/Release/NonShipping"
          ./eng/librewinforms-package-smoke.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: librewinforms-ci-packages-${{ github.sha }}
          path: |
            artifacts/packages/Release/NonShipping/*.nupkg
            artifacts/packages/Release/NonShipping/*.json
            artifacts/packages/Release/NonShipping/*.tar.gz
            artifacts/packages/Release/NonShipping/*.sha256
            artifacts/packages/Release/NonShipping/README.md
            artifacts/packages/Release/NonShipping/NuGet.config
          if-no-files-found: error
